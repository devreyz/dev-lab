<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Relógio Analógico Moderno</title>
        <link rel="stylesheet" href="style.css" type="text/css" media="all" />
    </head>
    <body>
        <!-- =====================================================
         RELÓGIO (NÚMEROS + PONTEIROS)
    ====================================================== -->
        <div class="clock">
            <!-- Inserção dinâmica usando var(--i) para rotação -->
            <div class="number" style="--i: 1"><b>1</b></div>
            <div class="number" style="--i: 2"><b>2</b></div>
            <div class="number" style="--i: 3"><b>3</b></div>
            <div class="number" style="--i: 4"><b>4</b></div>
            <div class="number" style="--i: 5"><b>5</b></div>
            <div class="number" style="--i: 6"><b>6</b></div>
            <div class="number" style="--i: 7"><b>7</b></div>
            <div class="number" style="--i: 8"><b>8</b></div>
            <div class="number" style="--i: 9"><b>9</b></div>
            <div class="number" style="--i: 10"><b>10</b></div>
            <div class="number" style="--i: 11"><b>11</b></div>
            <div class="number" style="--i: 12"><b>12</b></div>

            <!-- Três ponteiros do relógio -->
            <div class="hand hour-hand" id="hour"><i></i></div>
            <div class="hand minute-hand" id="minute"><i></i></div>
            <div class="hand second-hand" id="second"><i></i></div>
        </div>

        <script src="script.js" type="text/javascript" charset="utf-8"></script>
    </body>
</html>
